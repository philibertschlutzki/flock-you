name: PlatformIO CI Build

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
          
    - name: Install PlatformIO
      run: |
        pip install --upgrade platformio
        pio --version
        
    - name: Build firmware for LILYGO T-Display-S3
      run: |
        pio run -e lilygo_tdisplay_s3
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-lilygo-tdisplay-s3
        path: |
          .pio/build/lilygo_tdisplay_s3/firmware.bin
          .pio/build/lilygo_tdisplay_s3/firmware.elf
        retention-days: 30
        
    - name: Check firmware size
      run: |
        pio run -e lilygo_tdisplay_s3 -t size

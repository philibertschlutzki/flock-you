; =============================================================================
; LILYGO T-Display-S3 (ESP32-S3 + ST7789 1.9")
; =============================================================================
; Dies ist die einzige unterstützte Zielhardware für dieses Projekt.
; 
; Features:
;   - ESP32-S3 mit PSRAM
;   - 1.9" ST7789 TFT Display (170x320)
;   - BLE + WiFi Scanning
;   - Display UI für Status und Alerts
;   - Kein Buzzer (Audio deaktiviert)
;
; Flash-Befehle:
;   pio run -t upload              (verwendet automatisch diese Standard-Umgebung)
;   pio run -e lilygo_tdisplay_s3 -t upload
;   pio device monitor             (Serielle Ausgabe ansehen)
; =============================================================================

[platformio]
default_envs = lilygo_tdisplay_s3

[env:lilygo_tdisplay_s3]
platform = espressif32
board = esp32-s3-devkitc-1  ; Generische ESP32-S3 Board-Definition
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^6.21.0
    bodmer/TFT_eSPI@^2.5.43

; -----------------------------------------------------------------------------
; Filter / Matching (Dokumentation)
; -----------------------------------------------------------------------------
; Die Pattern-Listen (SSID, MAC, BLE-Name, Raven-UUID) werden in
;   include/detection_patterns.h
; gepflegt.
;
; Detaillierte Referenz:
;   docs/FILTERS_AND_MATCHING_DE.md
;
; Optionaler Filter-Modus (wenn im Code unterstützt/aktiv):
;   -DFLOCKYOU_FILTER_MODE=FLOCKYOU_FILTER_MODE_LEGACY
;   -DFLOCKYOU_FILTER_MODE=FLOCKYOU_FILTER_MODE_ALLOWLIST
;
; Wildcards/Validierung:
; - Wildcard-Matching ist im Projekt vorgesehen (siehe Filter-Doku).
; - ENABLE_WILDCARD_VALIDATION steuert Boot-Warnungen/Checks.
;   Hinweis: einzelne Header können diese Validierung bewusst überschreiben
;   (z.B. für Tests mit kurzen Wildcards).
; -----------------------------------------------------------------------------

build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    ; Feature-Flags für LILYGO T-Display-S3
    -DFLOCKYOU_NO_BUZZER=1           ; Kein Buzzer vorhanden
    -DFLOCKYOU_HAS_DISPLAY=1         ; ST7789 Display aktiv
    ; TFT_eSPI Konfiguration via include
    -DUSER_SETUP_LOADED=1
    -include include/tdisplay_s3_tft_espi_setup.h
    ; Optionale Pattern-Validierung (Boot-Checks/Warnungen)
    -DENABLE_WILDCARD_VALIDATION=1

; =============================================================================
; Native Test Environment (für Unit Tests auf Host-System)
; =============================================================================
[env:native]
platform = native
test_framework = unity
build_flags = 
    -DUNITY_INCLUDE_CONFIG_H
    -std=c++11

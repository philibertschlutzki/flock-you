; =============================================================================
; DEFAULT ENVIRONMENT: LILYGO T-Display-S3 (ESP32-S3 + ST7789 1.9")
; =============================================================================
; Dies ist die primäre und bevorzugte Zielhardware für dieses Projekt.
; 
; Features:
;   - ESP32-S3 mit PSRAM
;   - 1.9" ST7789 TFT Display (170x320)
;   - BLE + WiFi Scanning
;   - Display UI für Status und Alerts
;   - Kein Buzzer (Audio deaktiviert)
;
; Flash-Befehle:
;   pio run -t upload              (verwendet automatisch diese Standard-Umgebung)
;   pio run -e lilygo_tdisplay_s3 -t upload
;   pio device monitor             (Serielle Ausgabe ansehen)
; =============================================================================

[env:lilygo_tdisplay_s3]
platform = espressif32
board = esp32-s3-devkitc-1  ; Generische ESP32-S3 Board-Definition
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^6.21.0
    bodmer/TFT_eSPI@^2.5.43
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    ; Feature-Flags für LILYGO T-Display-S3
    -DFLOCKYOU_NO_BUZZER=1           ; Kein Buzzer vorhanden
    -DFLOCKYOU_HAS_DISPLAY=1         ; ST7789 Display aktiv
    ; TFT_eSPI Konfiguration via include
    -DUSER_SETUP_LOADED=1
    -include include/tdisplay_s3_tft_espi_setup.h

; =============================================================================
; LEGACY/OPTIONAL ENVIRONMENTS
; =============================================================================
; Diese Umgebungen werden für ältere Hardware oder spezielle Anwendungsfälle
; beibehalten. Die Standard-Umgebung ist lilygo_tdisplay_s3.
; =============================================================================

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram_type = opi
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^6.21.0
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    ; XIAO hat Buzzer, kein Display
    -DFLOCKYOU_NO_BUZZER=0
    -DFLOCKYOU_HAS_DISPLAY=0

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_build.psram_type = opi
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^6.21.0
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    ; XIAO C3 hat Buzzer, kein Display
    -DFLOCKYOU_NO_BUZZER=0
    -DFLOCKYOU_HAS_DISPLAY=0
